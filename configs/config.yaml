# melody-miner inference config — tokenizer + model architecture + inference knobs.
# Training-only sections (augment / training / preprocessing / env_scaling) removed.

tokenizer:
  name: "remi_v1"
  # Beat resolution: subdivisions per quarter note. 4 → sixteenth-note grid.
  resolution: 4
  # How many positions per bar (assumes 4/4): resolution * 4 = 16.
  positions_per_bar: 16
  # Pitch range (inclusive). 21..108 covers the 88-key piano.
  pitch_min: 21
  pitch_max: 108
  # Duration binned in units of resolution (16th notes). 1..32 = 1/16 … 2 whole notes.
  duration_min: 1
  duration_max: 32
  # Velocity binned into N buckets across 1..127.
  velocity_bins: 32
  # Tempo binned log-scale into N buckets across [tempo_min, tempo_max] BPM.
  tempo_bins: 16
  tempo_min: 50
  tempo_max: 200
  # Track tags used during generation.
  tracks: ["melody", "accompaniment"]
  # Maximum sequence length (condition + target tokens).
  max_seq_len: 2560
  # Relative harmonic encoding.
  chord_qualities: 12
  use_key_tokens: true

model:
  name: "decoder_transformer_v1"
  d_model: 512
  n_layers: 12
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  use_rope: true
  tie_weights: true
  # RoPE buffer length — must be >= tokenizer.max_seq_len + generation headroom.
  max_seq_len: 4096

inference:
  # Tuned on ep7: temp 1.2 / top_p 0.97 puts rhythm distribution closest to GT.
  temperature: 1.2
  top_k: 0                # 0 = disabled
  top_p: 0.97
  max_new_tokens: 2048
  # Polyphony logit suppression — inference-time band-aid; 0.0 = disabled.
  # Enable only if generated accompaniment is observed to be too sparse.
  structural_suppression: 0.0
  # Harmonic avoid-note soft penalty — 0.0 = disabled.
  avoid_note_penalty: 0.0
  render_audio: false
  soundfont: ""           # path to .sf2; empty = auto-detect system soundfonts
  sample_rate: 22050

humanize:
  # Subtle velocity/timing randomness to reduce mechanical feel.
  enabled: true
  velocity_std: 6         # gaussian std (±MIDI velocity units)
  timing_std_ms: 8.0      # gaussian std for note-on jitter (ms)
  duration_std_ms: 5.0    # gaussian std for note duration jitter (ms)

dsp:
  # Post-processing: Reverb → Compressor → Limiter applied to rendered WAV.
  enabled: true
  reverb: true
  reverb_room_size: 0.25
  reverb_damping: 0.5
  reverb_wet_level: 0.18
  reverb_dry_level: 0.82
  compressor: true
  compressor_threshold_db: -18.0
  compressor_ratio: 4.0
  compressor_attack_ms: 5.0
  compressor_release_ms: 100.0
  limiter: true
  limiter_threshold_db: -1.0

audio_input:
  # Spectral noise reduction (applied before basic-pitch). For mic recordings.
  denoise: false
  # basic-pitch transcription parameters.
  onset_threshold: 0.5
  frame_threshold: 0.3
  min_note_length_ms: 58.0
  min_frequency: 32.7     # Hz — C1; raise to ~130 (C3) for vocals
  max_frequency: 2093.0   # Hz — C7

midi_output:
  # GM program number (0–127) per track.
  programs:
    melody:         40    # violin
    accompaniment:   0    # acoustic grand piano
