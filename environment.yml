# melody-miner single conda environment.
#
#   conda env create -f environment.yml
#   conda activate melody-miner
#   # PyTorch CUDA build (installed separately, matches your driver):
#   pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu128
#   pip install -r requirements.txt
#   pip install -e .
#
# conda provides the native toolchain (rust/ffmpeg/portaudio) that deepfilternet
# and audio I/O need — installing these via conda avoids the Windows build pain
# (conflict mitigation B in the README).
name: melody-miner
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - rust          # deepfilternet native (Rust) extension build
  - ffmpeg        # audio decode/resample for librosa/soundfile
  - portaudio     # sounddevice / mic
  - pip:
      - -r requirements.txt
